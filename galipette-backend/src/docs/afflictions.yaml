openapi: 3.0.0
info:
  title: Galipette Afflictions API
  version: 1.0.0
  description: API documentation for affliction management in the Galipette RPG platform

paths:
  /api/afflictions:
    get:
      summary: Get all afflictions
      tags: [Afflictions]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
        - in: query
          name: ids
          schema:
            type: string
          description: Comma-separated list of affliction IDs to filter
        - in: query
          name: tagIds
          schema:
            type: string
          description: Comma-separated list of tag IDs to filter
      responses:
        '200':
          description: List of afflictions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Affliction'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new affliction
      tags: [Afflictions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAfflictionDto'
      responses:
        '201':
          description: Affliction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Affliction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/afflictions/{id}:
    get:
      summary: Get affliction by ID
      tags: [Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Affliction ID
      responses:
        '200':
          description: Affliction retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Affliction'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affliction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update an affliction
      tags: [Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Affliction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAfflictionDto'
      responses:
        '200':
          description: Affliction updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Affliction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affliction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete an affliction
      tags: [Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Affliction ID
      responses:
        '204':
          description: Affliction deleted successfully
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Affliction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tags:
    get:
      summary: Get all tags
      tags: [Tags]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
        - in: query
          name: ids
          schema:
            type: string
          description: Comma-separated list of tag IDs to filter
      responses:
        '200':
          description: List of tags retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new tag
      tags: [Tags]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagDto'
      responses:
        '201':
          description: Tag created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Tag'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tags/{id}:
    get:
      summary: Get tag by ID
      tags: [Tags]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Tag ID
      responses:
        '200':
          description: Tag retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Tag'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a tag
      tags: [Tags]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Tag ID
      responses:
        '204':
          description: Tag deleted successfully
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/characters/{id}/afflictions:
    get:
      summary: Get afflictions for a character
      tags: [Character Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Character ID
      responses:
        '200':
          description: Character afflictions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CharacterAffliction'
        '400':
          description: Invalid character ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Apply an affliction to a character
      tags: [Character Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Character ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterAfflictionDto'
      responses:
        '201':
          description: Affliction applied to character successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CharacterAffliction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/characters/{id}/afflictions/{afflictionId}:
    patch:
      summary: Update severity of a character's affliction
      tags: [Character Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Character ID
        - in: path
          name: afflictionId
          required: true
          schema:
            type: integer
          description: Affliction ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - severity
              properties:
                severity:
                  type: integer
                  description: New severity level
      responses:
        '200':
          description: Character affliction updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CharacterAffliction'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Character affliction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Remove an affliction from a character
      tags: [Character Afflictions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Character ID
        - in: path
          name: afflictionId
          required: true
          schema:
            type: integer
          description: Affliction ID
      responses:
        '204':
          description: Affliction removed from character successfully
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Character affliction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Affliction:
      type: object
      properties:
        id:
          type: integer
          description: Affliction unique identifier
        name:
          type: string
          description: Affliction name
        description:
          type: string
          description: Affliction description
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Tag:
      type: object
      properties:
        id:
          type: integer
          description: Tag unique identifier
        name:
          type: string
          description: Tag name

    CharacterAffliction:
      type: object
      properties:
        id:
          type: integer
          description: Character affliction unique identifier
        characterId:
          type: integer
          description: Character ID
        afflictionId:
          type: integer
          description: Affliction ID
        severity:
          type: integer
          description: Affliction severity level
        affliction:
          $ref: '#/components/schemas/Affliction'

    CreateAfflictionDto:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: Affliction name
        description:
          type: string
          description: Affliction description
        tagIds:
          type: array
          items:
            type: integer
          description: Array of tag IDs

    UpdateAfflictionDto:
      type: object
      properties:
        name:
          type: string
          description: Affliction name
        description:
          type: string
          description: Affliction description
        tagIds:
          type: array
          items:
            type: integer
          description: Array of tag IDs

    CreateTagDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Tag name

    CharacterAfflictionDto:
      type: object
      required:
        - afflictionId
        - severity
      properties:
        afflictionId:
          type: integer
          description: Affliction ID
        severity:
          type: integer
          description: Affliction severity level

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        status:
          type: integer
          description: HTTP status code

  tags:
    - name: Afflictions
      description: Affliction management endpoints
    - name: Tags
      description: Tag management endpoints
    - name: Character Afflictions
      description: Character affliction management endpoints
