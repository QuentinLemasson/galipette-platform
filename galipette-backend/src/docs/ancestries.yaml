openapi: 3.0.0
info:
  title: Galipette Ancestries API
  version: 1.0.0
  description: API documentation for ancestry management in the Galipette RPG platform

paths:
  /api/ancestries:
    get:
      summary: Get all ancestries
      tags: [Ancestries]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of items per page
        - in: query
          name: ids
          schema:
            type: string
          description: Comma-separated list of ancestry IDs to filter
      responses:
        '200':
          description: List of ancestries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ancestry'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new ancestry
      tags: [Ancestries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAncestryDto'
      responses:
        '201':
          description: Ancestry created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Ancestry'
        '400':
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ancestries/{id}:
    get:
      summary: Get ancestry by ID
      tags: [Ancestries]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ancestry ID
      responses:
        '200':
          description: Ancestry retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Ancestry'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ancestry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update an ancestry
      tags: [Ancestries]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ancestry ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAncestryDto'
      responses:
        '200':
          description: Ancestry updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Ancestry'
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ancestry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete an ancestry
      tags: [Ancestries]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Ancestry ID
      responses:
        '204':
          description: Ancestry deleted successfully
        '400':
          description: Invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ancestry not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Ancestry:
      type: object
      properties:
        id:
          type: integer
          description: Ancestry unique identifier
        name:
          type: string
          description: Ancestry name
        description:
          type: string
          description: Ancestry description
        characters:
          type: array
          items:
            $ref: '#/components/schemas/Character'
          description: Characters of this ancestry

    Character:
      type: object
      properties:
        id:
          type: integer
          description: Character unique identifier
        name:
          type: string
          description: Character name
        ancestryId:
          type: integer
          description: Character ancestry ID

    CreateAncestryDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Ancestry name
        description:
          type: string
          description: Ancestry description

    UpdateAncestryDto:
      type: object
      properties:
        name:
          type: string
          description: Ancestry name
        description:
          type: string
          description: Ancestry description

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        status:
          type: integer
          description: HTTP status code

  tags:
    - name: Ancestries
      description: Ancestry management endpoints
